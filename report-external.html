/* NFC brand palette */
:root {
  --powder: #4ac2f2;   /* dominant */
  --dark: #006ca3;     /* headers / accents */
  --light: #cfe8f2;    /* infographic base */
  --accent: #91d6f2;   /* small blocking */
  --orange: #f1b434;   /* sparing */

  --gray: #b6b7b8;
  --ink: #0d2233;
  --ink-2: #4b6275;
  --paper: #ffffff;
  --bg: #eef6fa;
  --tl-green: #1fa855; --tl-yellow: #f2c417; --tl-magenta: #c3268a; --tl-cyan: #1ea7e1;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Proxima Nova', 'Helvetica Neue', Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }

/* Screen toolbar */

.toolbar .note { margin-right: auto; font-size: 0.82rem; color: var(--ink-2); }

.tbtn.primary { background: var(--dark); border-color: var(--dark); color: #fff; }
.tbtn:hover { filter: brightness(1.05); }

/* Pages */
.page { width: min(1180px, calc(100% - 32px)); margin: 0 auto 28px; background: var(--paper); border-radius: 18px; overflow: hidden;

.pad { padding: 44px 52px; }
.eyebrow { font-weight: 700; font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dark); }
h2 { font-weight: 700; font-size: 2.1rem; letter-spacing: -0.01em; margin-top: 6px; }
.lede { font-size: 1.08rem; line-height: 1.55; color: var(--ink-2); margin-top: 10px; max-width: 760px; }

.cover-logo { width: 150px; filter: drop-shadow(0 0 0 #fff) drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 6px 18px rgba(0,0,0,0.25)); }

<script>
const PILOT = new URLSearchParams(location.search).get('pilot') || 'las-vegas';
const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const fmt = (n) => (n == null ? 'XX' : Math.round(n).toLocaleString('en-US'));
const big = (n) => (n == null ? 'XX' : n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e4 ? Math.round(n / 1e3) + 'K' : fmt(n));
const money = (n) => (n >= 1e6 ? '$' + (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : '$' + Math.round(n / 1e3) + 'K');
const laToday = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
const monthName = (m, opt = { month: 'short' }) => new Date(m + '-15T12:00:00Z').toLocaleDateString('en-US', { ...opt, timeZone: 'UTC' });
const fmtD = (d) => new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'long', day: 'numeric', timeZone: 'UTC' });
// NFC per-court benchmarks (same as the PD portal's Health Impact card).
const PER_COURT = { savings: 70000, calories: 1300000, fatLost: 375, diabetesPct: 58 };

(async () => {
  const [trail, eng] = await Promise.all([
    fetch(`/api/trail?pilot=${encodeURIComponent(PILOT)}`).then((r) => r.json()),
    fetch('/api/engagement').then((r) => r.json()),
  ]);
  const P = trail.pilot, city = `${P.name}, ${P.state}`;
  const acc = eng.accessibility[city] || null;
  const areas = eng.areas?.[city] || null;
  const courts = (trail.courts || []).filter((c) => c.lat != null);
  const today = laToday();
  const launch = P.launchDate;

  // Engagements: Fitness Court QR scans + public Trail Line scans + app check-ins + app downloads.
  const courtScans = courts.reduce((t, c) => t + c.allTime, 0);
  const trailCodes = [...trail.stations.flatMap((s) => s.codes), ...(trail.unplaced || [])];
  const trailPublic = trailCodes.reduce((t, c) => t + c.publicScans, 0);
  let checkins = 0, downloads = 0;
  const appByMonth = {};
  for (const c of courts) {
    const e = eng.app.byCode[c.id];
    if (!e) continue;
    for (const [m, [ci, dl]] of Object.entries(e.m)) { checkins += ci; downloads += dl; appByMonth[m] = (appByMonth[m] || 0) + ci + dl; }
  }
  const total = courtScans + trailPublic + checkins + downloads;

  // Performance model: identical to Analytics > Performance report, using the
  // assumptions saved there (same browser), else NFC defaults.
  const A = { courtScanMult: 1, downloadMult: 10, visitsPerYear: 25, kcalCourt: 250, trailMult: 10, kcalTrail: 100, uniqueShare: 92, savingsPerCourt: 70000 };
  try { Object.assign(A, JSON.parse(localStorage.getItem('nfc-perf-assumptions') || '{}')); } catch {}
  const U = A.uniqueShare / 100;
  let dlAll = 0;
  for (const c of courts) { const r = eng.app.allTime?.[c.id]; if (r) dlAll += r[1]; }
  const fcUsers = Math.max(dlAll * A.downloadMult, courtScans * U * A.courtScanMult);
  const groupOf = (line) => (/bonanza|red line/i.test(line || '') ? 'red' : /lone mountain|yellow line/i.test(line || '') ? 'yellow' : 'loops');
  const gScans = { red: 0, yellow: 0, loops: 0 };
  for (const st of trail.stations) for (const c of st.codes) gScans[groupOf(st.line)] += c.publicScans;
  const G = acc?.trailGroups || {};
  const live = today >= launch;
  const mk = (label, color, sub, reachN, users, kcalPer, isTrail) => {
    const uses = users == null ? null : users * A.visitsPerYear;
    return { label, color, sub, reach: reachN, users, uses, kcal: uses == null ? null : uses * kcalPer, isTrail };
  };
  const perfCols = [
    mk('Fitness Courts', '#006ca3', `${courts.length} outdoor Fitness Courts`, acc?.courts?.population ?? null, fcUsers, A.kcalCourt, false),
    mk('Red line', '#a52714', `Bonanza Trail${G.red?.miles ? ' · ' + G.red.miles + ' miles' : ''}`, G.red?.population ?? null, live ? gScans.red * U * A.trailMult : null, A.kcalTrail, true),
    mk('Yellow line', '#d99a06', `Lone Mountain Trail${G.yellow?.miles ? ' · ' + G.yellow.miles + ' miles' : ''}`, G.yellow?.population ?? null, live ? gScans.yellow * U * A.trailMult : null, A.kcalTrail, true),
  ];
  const trailUsersAll = live ? (gScans.red + gScans.yellow + gScans.loops) * U * A.trailMult : 0;
  const whole = { reach: acc?.combined?.population ?? null, users: fcUsers + trailUsersAll };
  whole.uses = fcUsers * A.visitsPerYear + trailUsersAll * A.visitsPerYear;
  whole.kcal = fcUsers * A.visitsPerYear * A.kcalCourt + trailUsersAll * A.visitsPerYear * A.kcalTrail;

  // Monthly engagements since complete tracking began (Apr 2026), stacked.
  const months = [];
  for (let m = '2026-04'; m <= today.slice(0, 7);) { months.push(m); const [y, mm] = m.split('-').map(Number); m = mm === 12 ? `${y + 1}-01` : `${y}-${String(mm + 1).padStart(2, '0')}`; }
  const sumDays = (days, m) => Object.entries(days || {}).filter(([d]) => d.startsWith(m) && d >= '2026-04-07').reduce((t, [, v]) => t + v, 0);
  const mCourt = months.map((m) => courts.reduce((t, c) => t + sumDays(c.days, m), 0));
  const mTrail = months.map((m) => trailCodes.reduce((t, c) => t + Object.entries(c.days || {}).filter(([d]) => d.startsWith(m) && launch && d >= launch).reduce((a, [, v]) => a + v, 0), 0));
  const mApp = months.map((m) => appByMonth[m] || 0);
  const mMax = Math.max(1, ...months.map((_, i) => mCourt[i] + mTrail[i] + mApp[i]));
  const full = months.filter((m) => m < today.slice(0, 7));
  const last = full.at(-1), prev = full.at(-2);
  const tot = (m) => { const i = months.indexOf(m); return mCourt[i] + mTrail[i] + mApp[i]; };

  const nCourts = courts.length;
  const reach = acc?.combined?.population ?? null;
  const kcal = nCourts * PER_COURT.calories;
  const savings = nCourts * PER_COURT.savings;
  const miles = acc?.trail?.trailMiles;
  const reportMonth = new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'America/Los_Angeles' });
  const C = { court: '#006ca3', trail: '#c3268a', app: '#4ac2f2' };

  document.getElementById('report').innerHTML = `
  <section class="page cover">
    <div class="bars" aria-hidden="true"><i style="width:55%"></i><i style="width:70%"></i><i style="width:85%"></i><i></i></div>
    <div class="pad">
      <div>
        <img class="cover-logo" src="/assets/nfc-logo.png" alt="National Fitness Campaign">
        <div class="eyebrow">Prepared for the City of ${esc(P.name)}</div>
        <h1>${esc(P.name)}<br>Impact Report</h1>
        <div class="sub">Fitness Courts, the Trail Line and the NFC app: who they reach and how ${esc(P.name)} is using them.</div>
        <div class="date">${esc(reportMonth)}</div>
        <div class="draft-flag">Draft</div>
      </div>
      <div class="cover-stats">
        <div class="cstat"><div class="num">${fmt(reach)}</div><div class="lbl">Residents within a 10 minute walk</div><div class="hint">of a Fitness Court or the Trail Line</div></div>
        <div class="cstat"><div class="num">${big(kcal)}</div><div class="lbl">Calories burned per year</div><div class="hint">NFC estimate for ${nCourts} Fitness Courts</div></div>
        <div class="cstat"><div class="num">${fmt(whole.users)}</div><div class="lbl">Estimated users</div><div class="hint">people using the Fitness Courts${live ? ' and the Trail Line' : ''} to date</div></div>
      </div>
    </div>
  </section>

  <section class="page"><div class="pad">
    <div class="eyebrow">Reach</div>
    <h2>${fmt(reach)} residents can walk to a Fitness Court or the Trail Line in 10 minutes</h2>
    <p class="lede">Shaded areas show everywhere a resident can reach on foot in 10 minutes along real streets: ${fmt(acc?.courts?.population)} near a Fitness Court and ${fmt(acc?.trail?.population)} along the Trail Line${acc ? `, ${fmt(acc.combined.population - acc.courts.population)} of them reached only by the Trail Line` : ''}.</p>
    <div class="mapbox" id="ext-map" style="margin-top:22px;height:460px"></div>
    <div class="legend-inline"><span><i style="background:rgba(0,108,163,0.35)"></i>Fitness Court walk area</span><span><i style="background:rgba(195,38,138,0.35)"></i>Trail Line walk area</span><span><i style="background:#0d2233"></i>City limits</span></div>
  </div></section>

  <section class="page"><div class="pad">
    <div class="eyebrow">Program performance</div>
    <h2>How each part of the program is performing</h2>
    <p class="lede">The same four measures for every part of ${esc(P.name)}'s program: who can walk to it, how many people use it, how often, and the calories they burn.</p>
    <div class="perf-whole">
      <div class="pw-title"><b>Whole project</b><span>Fitness Courts and the Trail Line together</span></div>
      <div><div class="num">${fmt(whole.reach)}</div><div class="lbl">Residents within a 10 minute walk</div></div>
      <div><div class="num">${big(whole.users)}</div><div class="lbl">Estimated users</div></div>
      <div><div class="num">${big(whole.uses)}</div><div class="lbl">Estimated uses a year</div></div>
      <div><div class="num">${big(whole.kcal)}</div><div class="lbl">Calories burned a year</div></div>
    </div>
    <div class="perf-cols">${perfCols.map((c) => `
      <div class="perf-col" style="--c:${c.color}">
        <div class="pc-head"><h3>${c.label}</h3><p>${esc(c.sub)}</p></div>
        <div class="pc-row"><div class="lbl">Residents within a 10 minute walk</div><div class="num">${fmt(c.reach)}</div></div>
        ${c.users == null ? `<div class="pc-soon"><b>Counting begins ${fmtD(launch)}</b><span>Users, uses and calories for the ${esc(c.label.toLowerCase())} start with the public launch.</span></div>` : `
        <div class="pc-row"><div class="lbl">Estimated users</div><div class="num">${big(c.users)}</div></div>
        <div class="pc-row"><div class="lbl">Estimated uses a year</div><div class="num">${big(c.uses)}</div></div>
        <div class="pc-row"><div class="lbl">Calories burned a year</div><div class="num">${big(c.kcal)}</div></div>`}
      </div>`).join('')}
    </div>
    <p class="xx-note" style="color:var(--ink-2)">Estimated users are the people NFC counts directly (new users in the NFC app and people scanning the QR code on each sign) scaled up for everyone who uses the site without the app or a scan. Uses assume ${A.visitsPerYear} visits a person a year. Calories: ${A.kcalCourt} per Fitness Court workout, ${A.kcalTrail} per Trail Line walk.</p>
  </div></section>

  <section class="page"><div class="pad">
    <div class="eyebrow">Engagement over time</div>
    <h2>${fmt(total)} engagements since tracking began</h2>
    <p class="lede">${last && prev ? `${monthName(last, { month: 'long' })} brought ${fmt(tot(last))} engagements${tot(prev) ? `, ${tot(last) >= tot(prev) ? 'up' : 'down'} ${Math.abs(Math.round(((tot(last) - tot(prev)) / tot(prev)) * 100))}% on ${monthName(prev, { month: 'long' })}` : ''}.` : ''} Every scan of a Fitness Court or Trail Line sign, every app check-in and every new app user counts once.</p>
    <div class="mtrend">${months.map((m, i) => { const t = mCourt[i] + mTrail[i] + mApp[i]; const h = (v) => Math.round((v / mMax) * 130); return `<div class="col"><b>${fmt(t)}</b><div class="stack" style="height:${Math.max(3, h(t))}px"><i style="height:${h(mCourt[i])}px;background:${C.court}"></i><i style="height:${h(mTrail[i])}px;background:${C.trail}"></i><i style="height:${h(mApp[i])}px;background:${C.app}"></i></div><span>${monthName(m)}${m === today.slice(0, 7) ? ' (to date)' : ''}</span></div>`; }).join('')}</div>
    <div class="legend-inline"><span><i style="background:${C.court}"></i>Fitness Courts</span><span><i style="background:${C.trail}"></i>Trail Line</span><span><i style="background:${C.app}"></i>NFC app</span></div>
    <div class="eyebrow" style="margin-top:34px">Health impact</div>
    <div class="health">
      <div><div class="num">${big(kcal)}</div><div class="lbl">Calories burned / year</div><div class="hint">1.3M per Fitness Court</div></div>
      <div><div class="num">${money(savings)}</div><div class="lbl">Healthcare savings / year</div><div class="hint">$70,000 per Fitness Court</div></div>
      <div><div class="num">${fmt(nCourts * PER_COURT.fatLost)} lb</div><div class="lbl">Fat lost / year</div><div class="hint">375 lb per Fitness Court</div></div>
      <div><div class="num">${PER_COURT.diabetesPct}%</div><div class="lbl">Lower Type 2 diabetes risk</div><div class="hint">among regular Fitness Court users</div></div>
    </div>
    <p class="xx-note">Health figures are NFC program estimates per Fitness Court. Trail Line and app health figures will be added once their formulas are set.</p>
  </div></section>

  <section class="page"><div class="pad">
    <div class="tl-head"><div class="tl-bars"><i></i><i></i><i></i><i></i></div><div><div class="eyebrow">Trail Line pilot</div><h2 style="margin-top:2px">What comes next</h2></div></div>
    <p class="lede">The Trail Line connects ${esc(P.name)}'s parks and Fitness Courts with ${trail.stations.length} signed stations along ${miles || 'XX'} miles. Each sign carries a city map and a link into the NFC app, so every visit can be counted.</p>
    <div class="timeline">
      <div class="step"><div class="dot">1</div><b>Signs installed</b><p>${esc(P.installWindow || 'Oct 19 to 21').replace('–', ' to ')}</p></div>
      <div class="step"><div class="dot">2</div><b>Public launch</b><p>${fmtD(launch)}: engagement counting begins</p></div>
      <div class="step"><div class="dot">3</div><b>Monthly updates</b><p>Reach, health impact and engagement, every month</p></div>
      <div class="step"><div class="dot">4</div><b>Pilot review</b><p>Results ahead of the spring budget cycle</p></div>
    </div>
    <div class="eyebrow" style="margin-top:36px">How these numbers are measured</div>
    <ul class="notes" style="margin-top:10px">
      <li><b>Residents within a 10 minute walk</b>: 2020 U.S. Census population inside a 10 minute walk along the street network from each Fitness Court and along the Trail Line, within city limits. Each resident is counted once.</li>
      <li><b>Engagements</b>: one QR scan of a Fitness Court or Trail Line sign, one workout check-in in the NFC app, or one new app user at a ${esc(P.name)} Fitness Court. Trail Line engagements count from the public launch.</li>
      <li><b>Health impact</b>: NFC program estimates per Fitness Court per year.</li>
      <li>Figures shown as XX are still being finalized.</li>
    </ul>
  </div></section>`;

  // Walk-area map
  const map = L.map('ext-map', { zoomControl: false, scrollWheelZoom: false, attributionControl: true });
  map.setView(P.center, 12); // a view must exist before vector layers are added
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri', maxNativeZoom: 16, maxZoom: 19 }).addTo(map);
  const layers = [];
  if (areas?.boundary) layers.push(L.geoJSON(areas.boundary, { style: { color: '#0d2233', weight: 1.5, opacity: 0.6, dashArray: '6 5', fill: false }, interactive: false }).addTo(map));
  if (areas?.courts) layers.push(L.geoJSON(areas.courts, { style: { color: '#006ca3', weight: 2, fillColor: '#4ac2f2', fillOpacity: 0.3 }, interactive: false }).addTo(map));
  if (areas?.trail) layers.push(L.geoJSON(areas.trail, { style: { color: '#c3268a', weight: 2, fillColor: '#c3268a', fillOpacity: 0.22 }, interactive: false }).addTo(map));
  L.geoJSON(trail.loops, { style: (f) => ({ color: f.properties.stroke, weight: 4, opacity: 0.9 }), interactive: false }).addTo(map);
  for (const c of courts) L.circleMarker([c.lat, c.lon], { radius: 7, color: '#fff', weight: 2, fillColor: '#006ca3', fillOpacity: 1 }).bindTooltip(esc(c.name)).addTo(map);
  const b = L.featureGroup(layers.filter((l, i) => i > 0 || !areas?.boundary)).getBounds();
  b.isValid() ? map.fitBounds(b, { padding: [24, 24] }) : map.setView(P.center, 12);
})().catch((e) => { console.error(e); document.getElementById('report').innerHTML = `<div class="page"><div class="pad">Couldn't build the report: ${esc(e.message)}</div></div>`; });
</script>
</body>
</html>
