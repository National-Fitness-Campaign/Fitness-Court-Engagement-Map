<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Las Vegas Movement Report | National Fitness Campaign</title>
<meta name="description" content="Fitness Court engagement and the Trail Line pilot in Las Vegas, from live QR scan data.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'Proxima Nova'; src: url('/assets/fonts/proximanova-regular-webfont.woff2') format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Proxima Nova'; src: url('/assets/fonts/proximanova-medium-webfont.woff2') format('woff2'); font-weight: 500; font-display: swap; }
@font-face { font-family: 'Proxima Nova'; src: url('/assets/fonts/proximanova-semibold-webfont.woff2') format('woff2'); font-weight: 600; font-display: swap; }
@font-face { font-family: 'Proxima Nova'; src: url('/assets/fonts/proximanova-bold-webfont.woff2') format('woff2'); font-weight: 700; font-display: swap; }

/* NFC brand palette */
:root {
  --powder: #4ac2f2;   /* dominant */
  --dark: #006ca3;     /* headers / accents */
  --light: #cfe8f2;    /* infographic base */
  --accent: #91d6f2;   /* small blocking */
  --orange: #f1b434;   /* sparing */
  --red: #e02826;      /* sparing */
  --gray: #b6b7b8;
  --ink: #0d2233;
  --ink-2: #4b6275;
  --paper: #ffffff;
  --bg: #eef6fa;
  --tl-green: #1fa855; --tl-yellow: #f2c417; --tl-magenta: #c3268a; --tl-cyan: #1ea7e1;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Proxima Nova', 'Helvetica Neue', Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
.num { font-family: 'Bebas Neue', 'Proxima Nova', sans-serif; letter-spacing: 0.01em; line-height: 0.9; }

/* Screen toolbar */
.toolbar { position: sticky; top: 0; z-index: 1000; display: flex; gap: 10px; align-items: center; justify-content: flex-end;
  padding: 10px 24px; background: rgba(238,246,250,0.9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.toolbar .note { margin-right: auto; font-size: 0.82rem; color: var(--ink-2); }
.tbtn { font: 600 0.85rem 'Proxima Nova', sans-serif; border: 1px solid #c9dfe9; background: #fff; color: var(--ink); border-radius: 10px; padding: 9px 16px; cursor: pointer; }
.tbtn.primary { background: var(--dark); border-color: var(--dark); color: #fff; }
.tbtn:hover { filter: brightness(1.05); }

/* Pages */
.page { width: min(1180px, calc(100% - 32px)); margin: 0 auto 28px; background: var(--paper); border-radius: 18px; overflow: hidden;
  box-shadow: 0 2px 6px rgba(13,34,51,0.05), 0 18px 40px rgba(13,34,51,0.08); }
.pad { padding: 44px 52px; }
.eyebrow { font-weight: 700; font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dark); }
h2 { font-weight: 700; font-size: 2.1rem; letter-spacing: -0.01em; margin-top: 6px; }
.lede { font-size: 1.08rem; line-height: 1.55; color: var(--ink-2); margin-top: 10px; max-width: 760px; }

/* Cover */
.cover { position: relative; background: linear-gradient(135deg, var(--powder) 0%, #2fb0e6 55%, var(--dark) 140%); color: #fff; min-height: 560px; }
.cover .pad { position: relative; z-index: 2; display: grid; grid-template-columns: 1.25fr 1fr; gap: 40px; align-items: center; min-height: 560px; }
.cover-logo { width: 150px; filter: drop-shadow(0 0 0 #fff) drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 6px 18px rgba(0,0,0,0.25)); }
.cover .eyebrow { color: rgba(255,255,255,0.9); margin-top: 26px; }
.cover h1 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: clamp(3.4rem, 7vw, 6.2rem); line-height: 0.88; margin-top: 8px; }
.cover .sub { font-size: 1.2rem; font-weight: 500; margin-top: 16px; opacity: 0.95; max-width: 520px; line-height: 1.45; }
.cover .date { margin-top: 22px; font-size: 0.9rem; font-weight: 600; opacity: 0.85; }
.cover-stats { display: grid; gap: 14px; }
.cstat { background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.28); border-radius: 16px; padding: 18px 22px; backdrop-filter: blur(4px); }
.cstat .num { font-size: 4rem; }
.cstat .lbl { font-weight: 700; font-size: 0.82rem; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 6px; }
.cstat .hint { font-size: 0.9rem; opacity: 0.9; margin-top: 3px; }
.bars { position: absolute; right: -40px; bottom: 36px; z-index: 1; display: grid; gap: 12px; width: 46%; opacity: 0.22; }
.bars i { display: block; height: 18px; border-radius: 10px; background: #fff; }

/* KPI band */
.band { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; background: var(--light); }
.band > div { padding: 22px 26px; }
.band > div + div { border-left: 1px solid rgba(0,108,163,0.15); }
.band .num { font-size: 3.1rem; color: var(--dark); }
.band .lbl { font-weight: 700; font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); margin-top: 4px; }
.band .hint { font-size: 0.82rem; color: var(--ink-2); margin-top: 2px; }

/* Section grids */
.grid2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 28px; margin-top: 26px; }
.mapbox { height: 420px; border-radius: 14px; overflow: hidden; border: 1px solid #d7e9f1; }
.card { border: 1px solid #d7e9f1; border-radius: 14px; padding: 20px 22px; }
.card h3 { font-weight: 700; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dark); margin-bottom: 14px; }

.rank { display: grid; gap: 11px; }
.rank .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
.rank .nm { font-weight: 600; font-size: 0.95rem; }
.rank .n { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; color: var(--dark); }
.rank .bar { grid-column: 1 / -1; height: 8px; border-radius: 6px; background: var(--light); overflow: hidden; }
.rank .bar i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--powder), var(--dark)); }

.trend { display: flex; align-items: flex-end; gap: 6px; height: 150px; margin-top: 4px; }
.trend .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
.trend .col i { width: 100%; border-radius: 6px 6px 3px 3px; background: var(--accent); min-height: 3px; }
.trend .col.last i { background: var(--powder); }
.trend .col span { font-size: 0.66rem; color: var(--ink-2); white-space: nowrap; }
.trend .col b { font-family: 'Bebas Neue', sans-serif; font-size: 0.95rem; font-weight: 400; color: var(--dark); }

.callout { margin-top: 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.callout > div { background: var(--bg); border-radius: 14px; padding: 16px 18px; }
.callout .k { font-weight: 700; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dark); }
.callout .v { font-weight: 700; font-size: 1.12rem; margin-top: 6px; }
.callout .d { font-size: 0.88rem; color: var(--ink-2); margin-top: 3px; line-height: 1.4; }

/* Trail Line */
.tl-head { display: flex; align-items: center; gap: 14px; }
.tl-bars { display: grid; gap: 4px; width: 54px; }
.tl-bars i { display: block; height: 6px; border-radius: 3px; }
.tl-bars i:nth-child(1) { width: 55%; background: var(--tl-green); }
.tl-bars i:nth-child(2) { width: 70%; background: var(--tl-yellow); }
.tl-bars i:nth-child(3) { width: 85%; background: var(--tl-magenta); }
.tl-bars i:nth-child(4) { width: 100%; background: var(--tl-cyan); }
.tiers { display: grid; gap: 10px; }
.tier { display: grid; grid-template-columns: 58px 1fr; gap: 14px; align-items: center; }
.tier .num { font-size: 2.8rem; color: var(--dark); text-align: center; }
.tier b { font-weight: 700; }
.tier p { font-size: 0.88rem; color: var(--ink-2); margin-top: 2px; line-height: 1.35; }
.timeline { margin-top: 28px; display: grid; grid-template-columns: repeat(4, 1fr); position: relative; }
.timeline::before { content: ''; position: absolute; left: 12%; right: 12%; top: 15px; height: 4px; border-radius: 2px; background: var(--light); }
.step { text-align: center; position: relative; padding: 0 8px; }
.step .dot { width: 34px; height: 34px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; background: #fff; border: 4px solid var(--light);
  font-weight: 700; color: var(--dark); position: relative; z-index: 1; }
.step.done .dot { background: var(--powder); border-color: var(--powder); color: #fff; }
.step.next .dot { border-color: var(--powder); }
.step b { display: block; margin-top: 10px; font-weight: 700; }
.step span { display: block; font-size: 0.86rem; color: var(--ink-2); margin-top: 3px; }
.measure { margin-top: 28px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.measure > div { border-left: 4px solid var(--powder); padding: 4px 0 4px 14px; }
.measure b { font-weight: 700; }
.measure p { font-size: 0.9rem; color: var(--ink-2); margin-top: 4px; line-height: 1.4; }

/* By the numbers */
.an-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 22px; margin-top: 24px; }
.months { display: flex; align-items: flex-end; gap: 10px; height: 170px; }
.months .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
.months .col i { width: 100%; border-radius: 8px 8px 3px 3px; background: linear-gradient(180deg, var(--powder), var(--dark)); min-height: 3px; }
.months .col.partial i { background: var(--accent); }
.months .col b { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 1.25rem; color: var(--dark); }
.months .col span { font-size: 0.72rem; color: var(--ink-2); font-weight: 600; }
.months .col em { font-style: normal; font-size: 0.68rem; font-weight: 700; }
.up { color: #1b8a4b; } .down { color: #c2410c; } .flat { color: var(--ink-2); }
.dow { display: grid; gap: 8px; }
.dow .row { display: grid; grid-template-columns: 38px 1fr 44px; gap: 10px; align-items: center; font-size: 0.86rem; }
.dow .row b { font-weight: 700; }
.dow .row .bar { height: 12px; border-radius: 6px; background: var(--light); overflow: hidden; }
.dow .row .bar i { display: block; height: 100%; background: var(--powder); border-radius: 6px; }
.dow .row.top .bar i { background: var(--dark); }
.dow .row span:last-child { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tbl { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 0.9rem; }
.tbl th { text-align: left; font-weight: 700; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); padding: 0 10px 10px; border-bottom: 2px solid var(--light); }
.tbl td { padding: 11px 10px; border-bottom: 1px solid #e3f0f6; vertical-align: middle; }
.tbl td.n, .tbl th.n { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.big { font-family: 'Bebas Neue', sans-serif; font-size: 1.35rem; color: var(--dark); }
.tbl tr:last-child td { border-bottom: none; }
.tbl .share { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.tbl .share i { display: block; height: 6px; border-radius: 3px; background: var(--powder); }
.spark { width: 110px; height: 28px; display: block; }
.note { margin-top: 18px; font-size: 0.8rem; color: var(--ink-2); line-height: 1.5; }
.foot { display: flex; align-items: center; gap: 16px; padding: 22px 52px; background: var(--ink); color: rgba(255,255,255,0.85); font-size: 0.85rem; }
.foot img { width: 46px; }
.foot b { color: #fff; }
.foot .right { margin-left: auto; text-align: right; }

.leaflet-tooltip.st-tip { background: none; border: none; box-shadow: none; padding: 0 4px; font: 700 11px 'Proxima Nova', sans-serif; color: var(--ink); text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; }
.leaflet-tooltip.st-tip::before { display: none; }
.fc-pin { background: var(--dark); border: 3px solid #fff; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 2px 6px rgba(13,34,51,0.35); }

.loading { padding: 80px; text-align: center; color: var(--ink-2); font-size: 1.05rem; }

@media screen and (max-width: 900px) {
  .an-grid { grid-template-columns: 1fr; }
  .tbl .hide-sm { display: none; }
  .pad { padding: 30px 22px; }
  .cover .pad, .grid2 { grid-template-columns: 1fr; }
  .band, .callout, .measure { grid-template-columns: 1fr 1fr; }
  .timeline { grid-template-columns: 1fr 1fr; row-gap: 22px; }
  .timeline::before { display: none; }
  .bars { display: none; }
  .foot { flex-wrap: wrap; padding: 22px; }
}
@media screen and (max-width: 560px) {
  .band, .callout, .measure { grid-template-columns: 1fr; }
  .band > div + div { border-left: none; border-top: 1px solid rgba(0,108,163,0.15); }
}

/* Print: clean landscape pages, one section per page */
@page { size: letter landscape; margin: 0.35in; }
@media print {
  body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .toolbar { display: none; }
  /* Desktop layout at a fixed width, scaled so each section fills one
     letter-landscape page (about 989 x 749 css px inside the margins). */
  .page { width: 1620px; zoom: 0.6; margin: 0; border-radius: 0; box-shadow: none; break-after: page; page-break-after: always; break-inside: avoid; }
  .page:last-of-type { break-after: auto; page-break-after: auto; }
  .cover, .cover .pad { min-height: 1240px; }
  .pad { padding: 36px 48px; }
  .mapbox { height: 300px; }
  .trend { height: 95px; }
  .months { height: 140px; }
  .grid2, .an-grid { margin-top: 18px; }
  .callout, .timeline, .measure { margin-top: 18px; }
  .tbl td { padding: 8px 10px; }
  .leaflet-control-zoom { display: none; }
}

</style>
</head>
<body>
<div class="toolbar">
  <a class="tbtn" href="/#analytics" onclick="if (document.referrer.startsWith(location.origin)) { history.back(); return false; }">← Back to tracking</a>
  <span class="note" id="note">Live data · updates automatically</span>
  <button class="tbtn" onclick="copyLink()" id="copy-btn">Copy link</button>
  <button class="tbtn primary" onclick="window.print()">Download PDF</button>
</div>
<div id="report"><div class="loading">Building the Las Vegas report…</div></div>

<script>
const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const fmt = (n) => Number(n || 0).toLocaleString('en-US');
const laDay = (t) => new Date(t).toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
const addDays = (d, n) => new Date(Date.parse(d + 'T12:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const niceDay = (d) => new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
// "Las Vegas'" not "Las Vegas's"
const poss = (name) => (/s$/i.test(name) ? `${name}'` : `${name}'s`);
const TIER = { gateway: 'Gateway', midway: 'Midway', marker: 'Trail Marker' };
const TIER_COLOR = { gateway: '#006ca3', midway: '#4ac2f2', marker: '#91d6f2' };

function copyLink() {
  navigator.clipboard?.writeText(location.href).then(() => {
    const b = document.getElementById('copy-btn'); b.textContent = 'Link copied'; setTimeout(() => (b.textContent = 'Copy link'), 1800);
  });
}

function weekly(courts, weeks) {
  const today = laDay(Date.now());
  const out = [];
  for (let k = weeks - 1; k >= 0; k--) {
    const end = addDays(today, -7 * k), start = addDays(end, -6);
    const n = courts.reduce((t, c) => t + Object.entries(c.days || {}).filter(([d]) => d >= start && d <= end).reduce((m, [, v]) => m + v, 0), 0);
    out.push({ start, end, n });
  }
  return out;
}

function baseMap(el, center) {
  const m = L.map(el, { zoomControl: true, scrollWheelZoom: false, attributionControl: true }).setView(center, 11);
  // Raster tiles print reliably (vector/WebGL canvases can print blank).
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri', maxNativeZoom: 16, maxZoom: 18,
  }).addTo(m);
  return m;
}

async function build() {
  const pilot = new URLSearchParams(location.search).get('pilot') || 'las-vegas';
  const data = await (await fetch(`/api/trail?pilot=${encodeURIComponent(pilot)}`)).json();
  if (data.error) throw new Error(data.error);
  const city = `${data.pilot.name}, ${data.pilot.state}`;
  document.title = `${data.pilot.name} Movement Report | National Fitness Campaign`;
  const courts = data.courts || [];
  const allTime = courts.reduce((t, c) => t + c.allTime, 0);
  const wk = weekly(courts, 12);
  const thisWeek = wk.at(-1).n, lastWeek = wk.at(-2).n;
  const avg = Math.round(wk.reduce((t, w) => t + w.n, 0) / wk.length);
  const best = wk.reduce((a, b) => (b.n > a.n ? b : a), wk[0]);
  const ranked = [...courts].sort((a, b) => b.allTime - a.allTime);
  const maxCourt = Math.max(1, ...ranked.map((c) => c.allTime));
  const stations = data.stations || [];
  const tiers = ['gateway', 'midway', 'marker'].map((t) => ({ t, n: stations.filter((s) => s.tier === t).length + (data.unplaced || []).filter((u) => u.tier === t).length }));
  const signs = stations.reduce((t, s) => t + s.codes.length, 0) + (data.unplaced || []).length;
  const today = laDay(Date.now());
  const launch = data.pilot.launchDate, install = data.pilot.installStart;
  const live = launch && today >= launch;
  const maxW = Math.max(1, ...wk.map((w) => w.n));
  // By the numbers. Complete per-scan history starts 2026-04-07.
  const TRACK_START = '2026-04-07';
  const allDays = new Map();
  for (const c of courts) for (const [d, v] of Object.entries(c.days || {})) if (d >= TRACK_START) allDays.set(d, (allDays.get(d) || 0) + v);
  const months = [];
  for (let m = new Date(Date.UTC(2026, 3, 1)); m.toISOString().slice(0, 7) <= today.slice(0, 7); m.setUTCMonth(m.getUTCMonth() + 1)) {
    const key = m.toISOString().slice(0, 7);
    let n = 0;
    for (const [d, v] of allDays) if (d.startsWith(key)) n += v;
    months.push({ key, n, label: m.toLocaleDateString('en-US', { month: 'short', timeZone: 'UTC' }), partial: key === TRACK_START.slice(0, 7) || key === today.slice(0, 7) });
  }
  const maxM = Math.max(1, ...months.map((m) => m.n));
  const pct = (a, b) => (b ? Math.round(((a - b) / b) * 100) : null);
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const DOW_FULL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const dowTot = Array(7).fill(0);
  for (const [d, v] of allDays) dowTot[new Date(d + 'T12:00:00Z').getUTCDay()] += v;
  const dowSum = dowTot.reduce((a, b) => a + b, 0) || 1;
  const dowTop = dowTot.indexOf(Math.max(...dowTot));
  const order = [1, 2, 3, 4, 5, 6, 0];
  const weekendShare = Math.round(((dowTot[0] + dowTot[6]) / dowSum) * 100);
  const rangeSum = (c, from, to) => Object.entries(c.days || {}).filter(([d]) => d >= from && d <= to).reduce((t, [, v]) => t + v, 0);
  const d30 = addDays(today, -29), p30a = addDays(today, -59), p30b = addDays(today, -30);
  const perCourt = ranked.map((c) => {
    const last30 = rangeSum(c, d30, today), prev30 = rangeSum(c, p30a, p30b);
    const spark = weekly([c], 12).map((w) => w.n);
    return { ...c, last30, prev30, change: last30 === 0 && prev30 === 0 ? 'none' : pct(last30, prev30), share: allTime ? Math.round((c.allTime / allTime) * 100) : 0, spark };
  });
  const cityLast30 = perCourt.reduce((t, c) => t + c.last30, 0), cityPrev30 = perCourt.reduce((t, c) => t + c.prev30, 0);
  const sparkSVG = (vals) => {
    const w = 110, h = 28, mx = Math.max(1, ...vals), st = w / (vals.length - 1);
    const pts = vals.map((v, i) => `${(i * st).toFixed(1)},${(h - 3 - (v / mx) * (h - 6)).toFixed(1)}`).join(' ');
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="0,${h} ${pts} ${w},${h}" fill="#4ac2f2" fill-opacity="0.18" stroke="none"/><polyline points="${pts}" fill="none" stroke="#006ca3" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  };
  const chg = (v) => (v === 'none' ? '<span class="flat">none</span>' : v == null ? '<span class="flat">new</span>' : `<span class="${v > 0 ? 'up' : v < 0 ? 'down' : 'flat'}">${v > 0 ? '▲' : v < 0 ? '▼' : ''} ${Math.abs(v)}%</span>`);
  const asOf = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric', timeZone: 'America/Los_Angeles' });

  document.getElementById('report').innerHTML = `
  <section class="page cover">
    <div class="bars" aria-hidden="true"><i style="width:55%"></i><i style="width:70%"></i><i style="width:85%"></i><i></i></div>
    <div class="pad">
      <div>
        <img class="cover-logo" src="/assets/nfc-logo.png" alt="National Fitness Campaign">
        <div class="eyebrow">Movement Report · City of ${esc(data.pilot.name)}</div>
        <h1>${esc(data.pilot.name)}<br>Moves</h1>
        <p class="sub">How residents are using ${esc(poss(data.pilot.name))} Fitness Courts today, and the Trail Line network launching ${esc(data.pilot.installWindow || 'the trail')}.</p>
        <div class="date">As of ${esc(asOf)}</div>
      </div>
      <div class="cover-stats">
        <div class="cstat"><div class="num">${fmt(allTime)}</div><div class="lbl">Fitness Court scans</div><div class="hint">Across ${courts.length} Fitness Courts, all time</div></div>
        <div class="cstat"><div class="num">${stations.length}</div><div class="lbl">Trail Line stations</div><div class="hint">${signs} scannable signs · ${live ? 'live now' : 'installing ' + esc(data.pilot.installWindow || '')}</div></div>
      </div>
    </div>
  </section>

  <section class="page">
    <div class="band">
      <div><div class="num">${courts.length}</div><div class="lbl">Fitness Courts</div><div class="hint">Outdoor gyms across the city</div></div>
      <div><div class="num">${fmt(allTime)}</div><div class="lbl">Scans all time</div><div class="hint">Every QR scan at a court</div></div>
      <div><div class="num">${fmt(thisWeek)}</div><div class="lbl">Scans this week</div><div class="hint">${lastWeek ? `${lastWeek} the week before` : 'Last 7 days'}</div></div>
      <div><div class="num">${fmt(avg)}</div><div class="lbl">Weekly average</div><div class="hint">Over the last 12 weeks</div></div>
    </div>
    <div class="pad">
      <div class="eyebrow">Fitness Court network</div>
      <h2>Where ${esc(data.pilot.name)} works out</h2>
      <p class="lede">Every Fitness Court carries QR codes that open free guided workouts in the Fitness Court app. Each scan is a resident starting a session, so scans show where the network is most used.</p>
      <div class="grid2">
        <div class="mapbox" id="court-map"></div>
        <div class="card">
          <h3>Courts by scans (all time)</h3>
          <div class="rank">${ranked.map((c) => `
            <div class="row"><span class="nm">${esc(c.name)}</span><span class="n">${fmt(c.allTime)}</span>
              <span class="bar"><i style="width:${Math.max(3, Math.round((c.allTime / maxCourt) * 100))}%"></i></span></div>`).join('')}
          </div>
        </div>
      </div>
      <div class="card" style="margin-top:22px">
        <h3>Weekly scans · last 12 weeks</h3>
        <div class="trend">${wk.map((w, i) => `
          <div class="col${i === wk.length - 1 ? ' last' : ''}"><b>${w.n}</b><i style="height:${Math.round((w.n / maxW) * 100)}%"></i><span>${niceDay(w.start)}</span></div>`).join('')}
        </div>
      </div>
      <div class="callout">
        <div><div class="k">Most used</div><div class="v">${esc(ranked[0]?.name || 'None yet')}</div><div class="d">${fmt(ranked[0]?.allTime)} scans, or ${Math.round(((ranked[0]?.allTime || 0) / Math.max(1, allTime)) * 100)}% of all court scans in the city.</div></div>
        <div><div class="k">Best week</div><div class="v">${fmt(best.n)} scans</div><div class="d">Week of ${niceDay(best.start)}, in the last 12 weeks.</div></div>
        <div><div class="k">Network</div><div class="v">${courts.length} courts, ${ranked.filter((c) => c.allTime > 0).length} active</div><div class="d">Each has QR codes leading to coached workouts.</div></div>
      </div>
    </div>
  </section>

  <section class="page">
    <div class="pad">
      <div class="eyebrow">By the numbers</div>
      <h2>How use is changing</h2>
      <p class="lede">Scans in the last 30 days: <b>${fmt(cityLast30)}</b>, ${cityPrev30 ? `${chg(pct(cityLast30, cityPrev30))} compared with the 30 days before (${fmt(cityPrev30)}).` : 'the first full period of tracking.'} ${esc(DOW_FULL[dowTop])} is the busiest day of the week, and weekends account for ${weekendShare}% of scans.</p>
      <div class="an-grid">
        <div class="card">
          <h3>Scans by month</h3>
          <div class="months">${months.map((m, i) => {
            const prev = months[i - 1];
            const c = prev && !m.partial && !prev.partial ? pct(m.n, prev.n) : null;
            return `<div class="col${m.partial ? ' partial' : ''}"><em>${c == null ? '&nbsp;' : chg(c)}</em><b>${fmt(m.n)}</b><i style="height:${Math.round((m.n / maxM) * 100)}%"></i><span>${m.label}${m.partial ? '*' : ''}</span></div>`;
          }).join('')}</div>
        </div>
        <div class="card">
          <h3>When people scan</h3>
          <div class="dow">${order.map((i) => `
            <div class="row${i === dowTop ? ' top' : ''}"><b>${DOW[i]}</b><span class="bar"><i style="width:${Math.round((dowTot[i] / Math.max(...dowTot)) * 100)}%"></i></span><span>${Math.round((dowTot[i] / dowSum) * 100)}%</span></div>`).join('')}
          </div>
        </div>
      </div>
      <div class="card" style="margin-top:22px">
        <h3>Court by court</h3>
        <table class="tbl">
          <thead><tr><th>Fitness Court</th><th class="n">All time</th><th class="n">Last 30 days</th><th class="n">vs. prior 30</th><th class="n hide-sm">Share</th><th class="hide-sm">12-week trend</th><th class="hide-sm">Last scan</th></tr></thead>
          <tbody>${perCourt.map((c) => `
            <tr><td><b>${esc(c.name)}</b></td><td class="n big">${fmt(c.allTime)}</td><td class="n">${fmt(c.last30)}</td><td class="n">${chg(c.change)}</td>
              <td class="n hide-sm"><div class="share"><i style="width:${Math.max(3, c.share * 1.2)}px"></i>${c.share}%</div></td>
              <td class="hide-sm">${sparkSVG(c.spark)}</td><td class="hide-sm">${c.lastScan ? niceDay(c.lastScan) : 'None yet'}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
      <p class="note">* Partial month. Scans are QR code scans at each Fitness Court, counted by Pacific day. Every scan is recorded from April 7, 2026; all-time totals come from the QR platform and include earlier history. Monthly and 30-day figures count people, excluding automated traffic.</p>
    </div>
  </section>

  <section class="page">
    <div class="pad">
      <div class="tl-head"><div class="tl-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="eyebrow">Trail Line pilot</div></div>
      <h2>Turning ${esc(poss(data.pilot.name))} trails into a connected workout network</h2>
      <p class="lede">Trail Line adds wayfinding stations along the Bonanza and Lone Mountain trails and the park loops at Kellogg-Zaher, Bill Briare, Pioneer and Woofter. Each sign has QR codes for the trail map and for free coached cardio workouts, linking trail users to the Fitness Courts nearby.</p>
      <div class="grid2">
        <div class="mapbox" id="trail-map"></div>
        <div>
          <div class="card">
            <h3>The station network</h3>
            <div class="tiers">
              <div class="tier"><div class="num">${tiers[0].n}</div><div><b>Gateway stations</b><p>Full trail map, wayfinding and a 7-minute cardio challenge, at major trailheads and parks.</p></div></div>
              <div class="tier"><div class="num">${tiers[1].n}</div><div><b>Midway stations</b><p>Local map, digital access and a cardio challenge along the route.</p></div></div>
              <div class="tier"><div class="num">${tiers[2].n}</div><div><b>Trail marker</b><p>Line, distance and direction to keep the pace.</p></div></div>
            </div>
          </div>
        </div>
      </div>
      <div class="timeline">
        <div class="step done"><div class="dot">✓</div><b>Designed &amp; printed</b><span>Station maps and graphics complete</span></div>
        <div class="step ${install && today >= install ? 'done' : 'next'}"><div class="dot">${install && today >= install ? '✓' : '2'}</div><b>Installation</b><span>${esc(data.pilot.installWindow || 'Scheduled')}</span></div>
        <div class="step ${live ? 'done' : ''}"><div class="dot">${live ? '✓' : '3'}</div><b>Public launch</b><span>${launch ? niceDay(launch) : 'After install'}: scan tracking begins</span></div>
        <div class="step"><div class="dot">4</div><b>First results</b><span>Station-by-station engagement report</span></div>
      </div>
      <div class="measure">
        <div><b>Use by station</b><p>Which trailheads and loops draw people in, week over week.</p></div>
        <div><b>Map vs. coaching</b><p>How many scans open the trail map versus a guided workout.</p></div>
        <div><b>Trail ↔ Court</b><p>How the Trail Line lifts use of nearby Fitness Courts.</p></div>
      </div>
    </div>
    <div class="foot">
      <img src="/assets/nfc-logo.png" alt="">
      <div><b>National Fitness Campaign</b><br>Prepared for the City of ${esc(data.pilot.name)} · ${esc(asOf)}</div>
      <div class="right">Data: live QR scans (Uniqode) and NFC station plans.<br>This report updates automatically.</div>
    </div>
  </section>`;

  // Fitness Court map
  const cm = baseMap('court-map', data.pilot.center);
  const placed = courts.filter((c) => c.lat != null);
  for (const c of placed) {
    const size = Math.round(18 + 16 * Math.sqrt(c.allTime / maxCourt));
    L.marker([c.lat, c.lon], { icon: L.divIcon({ className: '', html: `<div class="fc-pin" style="width:${size}px;height:${size}px"></div>`, iconSize: [size, size], iconAnchor: [size / 2, size] }) })
      .bindTooltip(`${esc(c.name)} · ${fmt(c.allTime)}`, { direction: 'top', offset: [0, -size] }).addTo(cm);
  }
  if (placed.length) cm.fitBounds(placed.map((c) => [c.lat, c.lon]), { padding: [40, 40], maxZoom: 13 });

  // Trail Line map: loops + stations
  const tm = baseMap('trail-map', data.pilot.center);
  L.geoJSON(data.loops, { style: (f) => ({ color: f.properties.stroke, weight: /spine/i.test(f.properties.name) ? 6 : 4, opacity: 0.9, dashArray: /connector/i.test(f.properties.name) ? '6 6' : null, lineCap: 'round' }) }).addTo(tm);
  for (const s of stations) {
    const r = s.tier === 'gateway' ? 9 : 7;
    const crowded = stations.some((o) => o !== s && o.lon > s.lon && tm.distance([s.lat, s.lon], [o.lat, o.lon]) < 180);
    L.circleMarker([s.lat, s.lon], { radius: r, color: '#fff', weight: 2.5, fillColor: TIER_COLOR[s.tier], fillOpacity: 1 })
      .bindTooltip(esc(s.id), { permanent: true, direction: crowded ? 'left' : 'right', offset: [crowded ? -r : r, 0], className: 'st-tip' }).addTo(tm);
  }
  for (const c of placed) {
    L.marker([c.lat, c.lon], { icon: L.divIcon({ className: '', html: '<div class="fc-pin" style="width:16px;height:16px"></div>', iconSize: [16, 16], iconAnchor: [8, 16] }) })
      .bindTooltip(`${esc(c.name)} (Fitness Court)`, { direction: 'top' }).addTo(tm);
  }
  if (stations.length) tm.fitBounds(stations.map((s) => [s.lat, s.lon]), { padding: [30, 30], maxZoom: 15 });
  document.getElementById('note').textContent = `Live data · as of ${asOf}`;
}

build().catch((err) => {
  document.getElementById('report').innerHTML = `<div class="loading">Couldn't build the report right now (${esc(err.message)}). Try again in a minute.</div>`;
});
</script>
</body>
</html>
